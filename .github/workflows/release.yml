name: Auto Release

on:
  push:
    branches: [main]

jobs:
  release:
    # Jangan rilis dari commit bump versi sendiri (cegah loop).
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cek sintaks script
        run: bash -n rexa-db-backup.sh

      - name: Naikkan versi patch
        id: ver
        run: |
          CUR=$(tr -d '[:space:]' < VERSION)
          MAJOR=$(echo "$CUR" | cut -d. -f1)
          MINOR=$(echo "$CUR" | cut -d. -f2)
          PATCH=$(echo "$CUR" | cut -d. -f3)
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "$NEXT" > VERSION
          sed -i "s/^APP_VERSION=\".*\"/APP_VERSION=\"$NEXT\"/" rexa-db-backup.sh
          bash -n rexa-db-backup.sh
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Rilis v$NEXT (dari $CUR)"

      - name: Commit bump versi + tag + push atomik
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION rexa-db-backup.sh
          git commit -m "chore: release v${{ steps.ver.outputs.version }} [skip ci]"
          git tag "v${{ steps.ver.outputs.version }}"
          # Satu push untuk branch + tag (cegah 'missing necessary objects').
          git push origin main "v${{ steps.ver.outputs.version }}"

      - name: Buat GitHub Release
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" rexa-db-backup.sh \
            --title "v${{ steps.ver.outputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
